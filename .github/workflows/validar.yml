name: Validar portal
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node --test tests/*.test.mjs
      - run: node scripts/validate-published.mjs
